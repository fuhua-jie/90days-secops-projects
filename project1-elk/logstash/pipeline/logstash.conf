# 同步自 VM 运行版本（/home/hua/elk/logstash/pipeline/logstash.conf）
# 同步日期：2026-10-09 · Day 52 ECS 升级版（本文件为源，已 ssh_upload 到 VM）
# 详解见 docs/ELK搭建手册.md 第 2 节「管道设计」+ 第 9 节「认证与 Security」
input {
  file {
    path => "/logs/*.log"
    start_position => "beginning"
    sincedb_path => "/logs/.sincedb_weblog"
    tags => ["weblog"]
  }
#------防止glob重叠----------
  file {
    path => "/logs/auth/*.log"
    start_position => "beginning"
    sincedb_path => "/logs/auth/.sincedb_ssh"
    tags => ["ssh"]
  }
}
#-----Web日志-------
filter {
  if "weblog" in [tags] {
    grok {
      # ★ 8.x 的 COMBINEDAPACHELOG 本身已输出 ECS 字段名（source.address/http.*/url.*/user_agent.*）
      #   不要再加 %{IP:source.address} 前缀——会双重解析导致 _grokparsefailure（Day 52 实测）
      match => { "message" => "%{COMBINEDAPACHELOG}" }
    }
    date {
      match => [ "timestamp", "dd/MMM/yyyy:HH:mm:ss Z" ]
    }
    # ---------- Day 52：ECS 语义字段（与 ES 端 _ingest/pipeline/weblog-ecs-upgrade 同构） ----------
    # 注意：Logstash 里嵌套字段必须用方括号 [a][b]，"a.b" 是字面带点的键，不是嵌套
    mutate { copy => { "[http][request][method]" => "[event][action]" } }
    mutate { add_field => { "[event][category]" => "network" "[event][kind]" => "event" } }
    # ---------- 清理：必须排在 date 之后（timestamp 是 date 的原料） ----------
    mutate { remove_field => [ "timestamp", "@version" ] }
  }
#------SSH日志-------
  if "ssh" in [tags] {
    grok {
	#先拼写一下信封，并且定义正文为ssh_message     时间             主机    
      match => { "message" => "%{TIMESTAMP_ISO8601:log_timestamp} %{IPORHOST:host_name} %{NOTSPACE}\[%{POSINT}\]: %{GREEDYDATA:ssh_message}" }
    }
      mutate { copy => {"host_name" => "[host][name]" }}
#开始拼写正文
    if "Failed password" in [ssh_message] {
      grok {
        match => { "ssh_message" => "Failed password for (?:invalid user )?%{USERNAME:ssh_name} from %{IP:ssh_ip}"}
      }
      mutate { add_field => { "ssh_event" => "login_failed" }}
    }

    else if "Accepted" in [ssh_message] {
      grok {
        match => { "ssh_message" => "Accepted %{WORD} for %{USERNAME:ssh_name} from %{IP:ssh_ip}" }
      }
      mutate { add_field => { "ssh_event" => "login_success"}}
    }
  
    else if "Invalid user" in [ssh_message] {
      grok {
        match => { "ssh_message" => "Invalid user %{USERNAME:ssh_name} from %{IP:ssh_ip}"}
      }
      mutate { add_field => { "ssh_event" => "invalid_user"}}
    }

    else if "pam_unix(sshd:session)" in [ssh_message] {
      grok {
        match => { "ssh_message" => "pam_unix\(sshd:session\): session %{WORD} for user %{USERNAME:ssh_name}"}
      }
      mutate { add_field => { "ssh_event" => "pam_unix" }}
    }

    else if "Disconnected" in [ssh_message] {
      grok{
        match => { "ssh_message" => "Disconnected from (?:invalid user |authenticating user )?%{USERNAME:ssh_name} %{IP:ssh_ip} port %{POSINT:ssh_port} \[preauth\]" }
      }
      mutate { add_field => { "ssh_event" => "disconnect" } }
    }

    else if "Server listening" in [ssh_message] {
      mutate { add_field => { "ssh_event" => "service_event" } }
    }

    else {
      mutate { add_field => { "ssh_event" => "other" } }   # ★ 兜底
    }
 # ---------- 时间转换 ----------
    date{
      match => [ "log_timestamp", "ISO8601"] #有时区[+00:00]，所以使用ISO08601
      target => "@timestamp"
    }
  # ---------- 清理 ----------
  # 位置：必须在这条 ssh 事件的最后 —— 上面所有分支都用过 ssh_message
  #  已启用：解析完成后清掉落地面字段
    mutate { remove_field => [ "log_timestamp","ssh_message" ] }
  }
}

output {
  if "weblog" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "weblogs-%{+YYYY.MM.dd}" 
      user => "logstash_internal"
      password => "${ES_PWD}"
    }
  }
  if "ssh" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "ssh-auth-%{+YYYY.MM.dd}"   
      user => "logstash_internal"
      password => "${ES_PWD}"
    }
  }
}
