.man-warn{background:rgba(224,60,50,.08);border:1px solid rgba(224,60,50,.35);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--tx2);margin:10px 0 16px}

@media print{

const contentEl = document.getElementById('manualContent');

  `<div class="manual-page card ${i === 0 ? 'active' : ''}" id="mp-${i}" style="padding:20px 24px">${m.page}</div>`
).join('');

function show(idx) {
  document.querySelectorAll('.manual-tab').forEach((t, i) => t.classList.toggle('active', i === idx));
  document.querySelectorAll('.manual-page').forEach((p, i) => p.classList.toggle('active', i === idx));
}
document.querySelectorAll('.manual-tab').forEach(t => t.onclick = () => show(+t.dataset.i));
