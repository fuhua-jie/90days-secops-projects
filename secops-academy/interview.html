{ id:'scenario', ico:'🔥', name:'第四轮 · 场景应变', questions:[

/* ---------- 渲染 ---------- */
const tabsEl = document.getElementById('roundTabs');
const contentEl = document.getElementById('roundContent');
tabsEl.innerHTML = ROUNDS.map((r, i) =>
  `<div class="round-tab ${i===0?'active':''}" data-i="${i}"><span class="r-ico">${r.ico}</span><span>${r.name}</span><span class="r-done" style="display:none">✅</span></div>`
).join('');
contentEl.innerHTML = ROUNDS.map((r, i) => {
  const qs = r.questions.map((q, qi) => {
    const uid = `rq${i}_${qi}`;
    return `<div class="q-block">
      <div class="q-t">Q${qi+1}. ${q.q}</div>
      <textarea id="${uid}_answer" placeholder="在这里写下你的回答（建议先自己组织语言再打字）……"></textarea>
      <button class="btn btn-sm btn-ghost reveal-btn" onclick="document.getElementById('${uid}_ans').classList.add('show');this.style.display='none'">📖 查看参考答案</button>
      <div class="model-answer" id="${uid}_ans"><div>${q.model}</div>
        <div class="key-points"><b>✅ 自评要点（逐项勾选）</b><ul>${q.keys.map(k=>`<li>${k}</li>`).join('')}</ul></div>
      </div>
    </div>`;
  }).join('');
  return `<div class="round-page" id="rp-${i}" style="display:${i===0?'block':'none'}"><h3 style="font-size:16px;font-weight:800;margin:0 0 14px">${r.ico} ${r.name}</h3>${qs}</div>`;
}).join('');

function showRound(idx) {
  document.querySelectorAll('.round-tab').forEach((t,i)=>t.classList.toggle('active', i===idx));
  document.querySelectorAll('.round-page').forEach((p,i)=>p.style.display = i===idx ? 'block' : 'none');
}
document.querySelectorAll('.round-tab').forEach(t => t.onclick = () => showRound(+t.dataset.i));
showRound(0);
</script>
